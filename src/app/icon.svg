    <!-- serifs -->
    <rect x="122" y="140" width="82" height="10" rx="3"/>
    <rect x="122" y="366" width="74" height="10" rx="3"/>
    <rect x="316" y="140" width="74" height="10" rx="3"/>
  </g>
  <!-- coin -->
  <circle cx="392" cy="372" r="30" fill="#F2CDD3"/>
  <circle cx="392" cy="372" r="19" fill="none" stroke="#2F4A3A" stroke-width="4" opacity="0.55"/>
  <!-- subtle rising line -->
