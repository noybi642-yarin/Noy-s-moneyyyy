<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36543F"/>
      <stop offset="1" stop-color="#2A4334"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g fill="#F6F1E7">
    <!-- thin left stem -->
    <rect x="150" y="146" width="18" height="226"/>
    <!-- thick diagonal -->
    <polygon points="150,146 204,146 362,372 308,372"/>
    <!-- thin right stem -->
